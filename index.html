<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Scientific Calculator</title>
		<link rel="stylesheet" href="./css/style.css" />
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
			integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
			crossorigin="anonymous"
			referrerpolicy="no-referrer"
		/>
	</head>

	<body>
		<div class="container">
			<!-- Theme Toggle -->
			<div class="theme-toggle">
				<button id="themeBtn" class="theme-btn" title="Toggle Dark/Light Mode">
					<span class="theme-icon">🌙</span>
				</button>
			</div>
			<div class="calculator-wrapper">
				<!-- Main Calculator -->
				<div class="calculator">
					<div class="calculator-header">
						<h1>Scientific Calculator</h1>
					</div>

					<!-- Display Area -->
					<div class="display-area">
						<div class="history-display" id="historyDisplay"></div>
						<div class="current-display" id="currentDisplay">0</div>
					</div>

					<!-- Button Groups -->
					<div class="button-grid">
						<!-- Row 1: Memory & Clear Functions -->
						<div class="button-row">
							<button class="btn btn-function" data-action="clear">AC</button>
							<button class="btn btn-function" data-action="delete">DEL</button>
							<button class="btn btn-function" data-action="toggleSign">
								+/-
							</button>
							<button class="btn btn-operator" data-operator="%">%</button>
						</div>

						<!-- Row 2: Scientific Functions (Top) -->
						<div class="button-row">
							<button
								class="btn btn-scientific"
								data-function="sin"
								data-parenthesis="true"
							>
								sin
							</button>
							<button
								class="btn btn-scientific"
								data-function="cos"
								data-parenthesis="true"
							>
								cos
							</button>
							<button
								class="btn btn-scientific"
								data-function="tan"
								data-parenthesis="true"
							>
								tan
							</button>
							<button class="btn btn-operator" data-operator="/">÷</button>
						</div>

						<!-- Row 3: Scientific Functions (Middle) -->
						<div class="button-row">
							<button
								class="btn btn-scientific"
								data-function="sqrt"
								data-parenthesis="true"
							>
								√
							</button>
							<button
								class="btn btn-scientific"
								data-function="log"
								data-parenthesis="true"
							>
								log
							</button>
							<button
								class="btn btn-scientific"
								data-function="ln"
								data-parenthesis="true"
							>
								ln
							</button>
							<button class="btn btn-operator" data-operator="*">×</button>
						</div>

						<!-- Row 4: Scientific Functions (Bottom) -->
						<div class="button-row">
							<button class="btn btn-scientific" data-function="π">π</button>
							<button class="btn btn-scientific" data-function="e">e</button>
							<button class="btn btn-scientific" data-function="^">x^y</button>
							<button class="btn btn-operator" data-operator="-">−</button>
						</div>

						<!-- Row 5: Numbers & Operations (1-4) -->
						<div class="button-row">
							<button class="btn btn-number" data-number="7">7</button>
							<button class="btn btn-number" data-number="8">8</button>
							<button class="btn btn-number" data-number="9">9</button>
							<button class="btn btn-operator" data-operator="+">+</button>
						</div>

						<!-- Row 6: Numbers (4-6) -->
						<div class="button-row">
							<button class="btn btn-number" data-number="4">4</button>
							<button class="btn btn-number" data-number="5">5</button>
							<button class="btn btn-number" data-number="6">6</button>
							<button class="btn btn-function" data-action="reciprocal">
								1/x
							</button>
						</div>

						<!-- Row 7: Numbers (7-9) -->
						<div class="button-row">
							<button class="btn btn-number" data-number="1">1</button>
							<button class="btn btn-number" data-number="2">2</button>
							<button class="btn btn-number" data-number="3">3</button>
							<button
								class="btn btn-function"
								data-action="factorial"
								data-function="!"
							>
								n!
							</button>
						</div>

						<!-- Row 8: Numbers (0) , ( & )-->
						<div class="button-row">
							<button class="btn btn-number btn-zero" data-number="0">0</button>
							
							<button class="btn btn-function" data-function="(">(</button>
							<button class="btn btn-function" data-function=")">)</button>
						</div>
						<!-- Row 9 : Calculate Button & Decimal  -->
						<div class="button-row">
							<button class="btn btn-equals" data-action="calculate">=</button>

							<button class="btn btn-number" data-number=".">.</button>
						</div>
					</div>

					<!-- Parentheses Help -->
					<div class="parentheses-info">
						<small
							>Keyboard: Use +, -, *, /, Enter for =, Backspace for DEL, C for
							Clear</small
						>
					</div>  
				</div>
			</div>

			<!-- History Panel -->
			<div class="history-panel">
				<div class="history-header">
					<h2>Calculation History</h2>
					<button class="btn btn-small" id="clearHistoryBtn">Clear All</button>
				</div>
				<div class="history-list" id="historyList">
					<p class="empty">No calculations yet</p>
				</div>
			</div>

			<!-- Currency Exchange Panel -->
			<div class="currency-panel">
				<div class="currency-header">
					<h2>Currency Exchange</h2>
				</div>
				<div class="currency-body">
					<div class="currency-field">
						<label for="currencyDirection">Convert</label>
						<select id="currencyDirection">
							<option value="INR_TO_FOREIGN">
								Indian Rupee (INR) → Foreign Currency
							</option>
							<option value="FOREIGN_TO_INR">
								Foreign Currency → Indian Rupee (INR)
							</option>
						</select>
					</div>
					<div class="currency-field">
						<label for="currencyCode">Currency</label>
						<select id="currencyCode">
							<option value="USD">US Dollar (USD)</option>
							<option value="EUR">Euro (EUR)</option>
							<option value="GBP">British Pound (GBP)</option>
							<option value="JPY">Japanese Yen (JPY)</option>
							<option value="AUD">Australian Dollar (AUD)</option>
						</select>
					</div>
					<div class="currency-field">
						<label for="currencyAmount">Amount</label>
						<input
							type="number"
							id="currencyAmount"
							min="0"
							step="any"
							placeholder="Enter amount"
						/>
					</div>
					<button class="btn btn-equals currency-convert-btn" id="currencyConvertBtn">
						Convert
					</button>
					<div class="currency-result" id="currencyResult"></div>
					<div class="currency-note">
						<small
							>Rates are static reference values for demo purposes and do not
							reflect live market rates.</small
						>
					</div>
				</div>
			</div>
		</div>

		<script type="module" src="./dist/index.js"></script>
	</body>
</html>
